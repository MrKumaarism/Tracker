name: Daily Fuel Price Update

on:
  schedule:
    # Runs daily at 6:15 AM IST (00:45 UTC)
    - cron: '45 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  update-fuel-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Fuel Prices
        run: node scripts/fetch-fuel-prices.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fuel-prices.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update daily fuel prices [skip ci]"
            git push origin main
          else
            echo "No fuel price changes detected today."
          fi
